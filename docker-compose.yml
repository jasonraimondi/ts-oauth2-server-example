services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: oauth_example
      POSTGRES_USER: oauth
      POSTGRES_PASSWORD: secret
      TZ: UTC
      PGTZ: UTC
    ports:
      # Loopback-only: this is a demo database with a published password.
      - 127.0.0.1:8888:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth -d oauth_example"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
