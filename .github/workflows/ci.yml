name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oauth
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: oauth_example
        ports:
          - 8888:5432
        options: >-
          --health-cmd "pg_isready -U oauth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # DATABASE_URL is scoped to THIS step only — it must not leak into the test
      # step, where globalSetup reads process.env.DATABASE_URL for the oauth_test db
      # (dotenv won't override an already-set var, so a leaked value breaks setup).
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://oauth:secret@localhost:8888/oauth_example
      - run: pnpm typecheck
      - run: pnpm run build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: docker build -t oauth-server:ci .
      # Boot the image the way production will, so the fail-closed gates
      # (SESSION_SECRET, OIDC_PRIVATE_KEY, https issuer) are proven satisfiable
      # from environment alone rather than only in a dev shell.
      - name: Smoke-test the production image
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out ci-oidc-key.pem
          docker run -d --name oauth-smoke --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://oauth:secret@localhost:8888/oauth_example \
            -e OIDC_ISSUER=https://ci.example.com \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e OIDC_PRIVATE_KEY="$(cat ci-oidc-key.pem)" \
            oauth-server:ci
          for _ in $(seq 30); do
            curl -fsS http://localhost:3000/healthz > /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:3000/healthz || { docker logs oauth-smoke; exit 1; }
          docker rm -f oauth-smoke

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example-client
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: example-client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test
